<div class="auth-wrap">
  <div class="bg-blobs" aria-hidden="true">
    <span class="blob blob-1"></span>
    <span class="blob blob-2"></span>
    <span class="blob blob-3"></span>
  </div>

  <div class="auth-card">
    <div class="auth-header">
      <div class="logo">
        <i class="bi bi-capsule-pill"></i>
      </div>
      <h2>Dosette System</h2>
      <p class="subtitle">Pharmacy Inventory & Dosette Management</p>
    </div>

    <div *ngIf="errorMessage" class="alert alert-danger mt-2 text-center">
      <i class="bi bi-exclamation-triangle me-2"></i>
      {{ errorMessage }}
    </div>

    <form (ngSubmit)="$event.preventDefault(); onLogin()" class="auth-form" novalidate>
      <div class="form-group">
        <label>Email</label>
        <div class="input-shell">
          <i class="bi bi-envelope input-icon"></i>
          <input
            type="email"
            class="form-control"
            [ngClass]="{
              'is-valid': email && email.includes('@'),
              'is-invalid': email && !email.includes('@')
            }"
            [(ngModel)]="email"
            name="email"
            required
            placeholder="Enter your email"
          >
        </div>
      <small class="text-danger" *ngIf="email && !email.includes('@')">
        Please enter a valid email
      </small>
      </div>

      <div class="form-group">
        <label>Password</label>
        <div class="input-shell password-shell">
          <i class="bi bi-lock input-icon"></i>
          <input
            [type]="showPassword ? 'text' : 'password'"
            class="form-control"
            [ngClass]="{
              'is-valid': password && password.length >= 6,
              'is-invalid': password && password.length < 6
            }"
            [(ngModel)]="password"
            name="password"
            required
            placeholder="Enter your password"
          >
          <button
            type="button"
            class="password-toggle"
            (click)="togglePasswordVisibility()"
            [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
          >
            <i class="bi" [ngClass]="showPassword ? 'bi-eye-slash' : 'bi-eye'"></i>
          </button>
        </div>
      <small class="text-danger" *ngIf="password && password.length < 6">
        Password must be at least 6 characters
      </small>
      </div>

      <button class="btn btn-primary w-100 login-btn" type="submit" [disabled]="isLoading || !email || !password || !email.includes('@') || password.length < 6">
        <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>
        <i *ngIf="!isLoading" class="bi bi-box-arrow-in-right me-2"></i>
        {{ isLoading ? 'Signing in...' : 'Sign in' }}
      </button>

      <div class="auth-divider">
        <span>or</span>
      </div>

      <button class="btn btn-google w-100" type="button" (click)="loginWithGoogle()">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="google-icon" />
        Continue with Google
      </button>
    </form>

    <div class="auth-footer">
      <span>Don’t have an account?</span>
      <a routerLink="/register">Create account</a>
    </div>
  </div>
</div>
